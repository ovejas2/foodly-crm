<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foodly. CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0F0D;
  --bg2: #111710;
  --bg3: #161D14;
  --bg4: #1C2419;
  --green: #1FD79A;
  --green2: #0FAF7A;
  --green3: rgba(31,215,154,0.12);
  --green4: rgba(31,215,154,0.06);
  --text: #E8EDE6;
  --text2: #8A9688;
  --text3: #4A5448;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.04);
  --yellow: #F4C843;
  --red: #E24B4A;
  --blue: #5B9BD5;
  --orange: #E8874A;
  --purple: #9B7FD4;
  --radius: 10px;
  --radius-sm: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'Bricolage Grotesque', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--text3); border-radius: 2px; }

/* LAYOUT */
.app { display: flex; height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 1.5rem 0;
  position: relative;
  overflow: hidden;
}
.sidebar::before {
  content: '';
  position: absolute;
  top: -60px; left: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(31,215,154,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.logo {
  padding: 0 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1rem;
}
.logo-text {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.03em;
}
.logo-text span { color: var(--green); }
.logo-sub {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  color: var(--text3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.nav-section {
  padding: 0 .75rem;
  margin-bottom: .25rem;
}
.nav-label {
  font-family: 'Space Mono', monospace;
  font-size: .55rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
  padding: .5rem .5rem .25rem;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .55rem .75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text2);
  font-size: .85rem;
  font-weight: 500;
  transition: all .15s;
  position: relative;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  background: var(--green3);
  color: var(--green);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 2px; height: 60%;
  background: var(--green);
  border-radius: 2px;
}
.nav-icon { font-size: 1rem; width: 18px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--green);
  color: var(--bg);
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.nav-badge.warn { background: var(--yellow); }
.sidebar-footer {
  margin-top: auto;
  padding: 1rem 1.25rem 0;
  border-top: 1px solid var(--border);
}
.user-card {
  display: flex;
  align-items: center;
  gap: .6rem;
}
.user-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--green3);
  border: 1px solid var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  font-weight: 700;
  color: var(--green);
  flex-shrink: 0;
}
.user-name { font-size: .8rem; font-weight: 600; color: var(--text); }
.user-role { font-size: .65rem; color: var(--text3); font-family: 'Space Mono', monospace; }

/* MAIN */
.main {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* TOPBAR */
.topbar {
  display: flex;
  align-items: center;
  padding: 1rem 1.75rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.page-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}
.page-sub { font-size: .75rem; color: var(--text3); font-family: 'Space Mono', monospace; }
.topbar-actions { margin-left: auto; display: flex; gap: .5rem; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .45rem .9rem;
  border-radius: var(--radius-sm);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
}
.btn-primary {
  background: var(--green);
  color: var(--bg);
}
.btn-primary:hover { background: var(--green2); transform: translateY(-1px); }
.btn-ghost {
  background: var(--bg3);
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--bg4); color: var(--text); }

/* CONTENT */
.content { padding: 1.5rem 1.75rem; flex: 1; }

/* TABS */
.tabs {
  display: flex;
  gap: .25rem;
  margin-bottom: 1.5rem;
  background: var(--bg2);
  padding: .3rem;
  border-radius: var(--radius);
  width: fit-content;
  border: 1px solid var(--border);
}
.tab {
  padding: .45rem 1rem;
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text3);
  transition: all .15s;
  border: none;
  background: none;
  font-family: 'Bricolage Grotesque', sans-serif;
}
.tab:hover { color: var(--text2); }
.tab.active { background: var(--bg4); color: var(--green); border: 1px solid var(--border); }

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  position: relative;
  overflow: hidden;
  transition: border-color .2s;
}
.stat-card:hover { border-color: rgba(31,215,154,0.2); }
.stat-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent, var(--green));
  opacity: .4;
}
.stat-label {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: .4rem;
}
.stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
  margin-bottom: .3rem;
}
.stat-sub { font-size: .72rem; color: var(--text3); }
.stat-trend {
  font-size: .7rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.trend-up { color: var(--green); }
.trend-down { color: var(--red); }

/* PIPELINE */
.pipeline {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .75rem;
  margin-bottom: 1.5rem;
}
.pipeline-col {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pipeline-header {
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: .5rem;
}
.pipeline-stage-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pipeline-stage-name {
  font-size: .75rem;
  font-weight: 700;
  color: var(--text2);
  flex: 1;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.pipeline-count {
  font-family: 'Space Mono', monospace;
  font-size: .65rem;
  color: var(--text3);
  background: var(--bg3);
  padding: 1px 6px;
  border-radius: 10px;
}
.pipeline-cards { padding: .5rem; display: flex; flex-direction: column; gap: .4rem; min-height: 120px; }

/* PROSPECT CARD */
.prospect-card {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: .75rem;
  cursor: pointer;
  transition: all .15s;
  position: relative;
}
.prospect-card:hover {
  border-color: var(--border);
  background: var(--bg4);
  transform: translateY(-1px);
}
.prospect-card.urgent { border-left: 2px solid var(--yellow); }
.prospect-card.hot { border-left: 2px solid var(--red); }
.prospect-name {
  font-size: .82rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: .2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prospect-meta {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  color: var(--text3);
  margin-bottom: .5rem;
}
.prospect-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.prospect-personas {
  font-size: .7rem;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 3px;
}
.prospect-value {
  font-family: 'Space Mono', monospace;
  font-size: .68rem;
  font-weight: 700;
  color: var(--green);
}
.prospect-days {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg);
  color: var(--text3);
}
.prospect-days.urgent { color: var(--yellow); background: rgba(244,200,67,.1); }
.prospect-days.overdue { color: var(--red); background: rgba(226,75,74,.1); }

/* ADD CARD */
.add-card {
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: .6rem;
  text-align: center;
  cursor: pointer;
  color: var(--text3);
  font-size: .75rem;
  transition: all .15s;
}
.add-card:hover { border-color: var(--green); color: var(--green); background: var(--green4); }

/* CLIENTES ACTIVOS */
.clients-table {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-header {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr 100px;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
}
.th {
  font-family: 'Space Mono', monospace;
  font-size: .58rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
}
.table-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr 100px;
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border2);
  gap: 1rem;
  align-items: center;
  transition: background .15s;
  cursor: pointer;
}
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: var(--bg3); }
.td { font-size: .82rem; color: var(--text2); }
.td-main { color: var(--text); font-weight: 600; }
.td-mono { font-family: 'Space Mono', monospace; font-size: .75rem; }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: .68rem;
  font-weight: 600;
}
.status-pill::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.status-active { color: var(--green); background: rgba(31,215,154,.1); }
.status-prospect { color: var(--yellow); background: rgba(244,200,67,.1); }
.status-paused { color: var(--text3); background: var(--bg3); }
.status-negoc { color: var(--blue); background: rgba(91,155,213,.1); }

/* ACTIVIDAD */
.activity-feed {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.activity-header {
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.activity-item {
  display: flex;
  gap: .75rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--border2);
  align-items: flex-start;
  transition: background .15s;
}
.activity-item:last-child { border-bottom: none; }
.activity-item:hover { background: var(--bg3); }
.activity-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}
.activity-text { font-size: .82rem; color: var(--text2); line-height: 1.4; }
.activity-text strong { color: var(--text); }
.activity-time {
  margin-left: auto;
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform .2s;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: all .15s;
}
.modal-close:hover { background: var(--bg4); color: var(--text); }
.modal-body { padding: 1.25rem 1.5rem; }
.form-group { margin-bottom: 1rem; }
.form-label {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: .4rem;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .55rem .75rem;
  color: var(--text);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: .85rem;
  outline: none;
  transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(31,215,154,.08);
}
.form-select option { background: var(--bg3); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: .5rem;
}

/* TAGS */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: .65rem;
  font-weight: 600;
}
.tag-green { background: rgba(31,215,154,.1); color: var(--green); }
.tag-yellow { background: rgba(244,200,67,.1); color: var(--yellow); }
.tag-red { background: rgba(226,75,74,.1); color: var(--red); }
.tag-blue { background: rgba(91,155,213,.1); color: var(--blue); }
.tag-purple { background: rgba(155,127,212,.1); color: var(--purple); }
.tag-gray { background: var(--bg3); color: var(--text3); }

/* SECTION HEADER */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .75rem;
}
.section-title-text {
  font-size: .85rem;
  font-weight: 700;
  color: var(--text);
}
.section-sub {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  color: var(--text3);
  margin-top: 1px;
}

/* BOTTOM GRID */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1rem;
  margin-top: 1.5rem;
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--text3);
  font-size: .8rem;
}
.empty-icon { font-size: 1.5rem; margin-bottom: .5rem; opacity: .4; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--bg2);
  border: 1px solid var(--green);
  border-radius: var(--radius);
  padding: .75rem 1.25rem;
  font-size: .82rem;
  color: var(--green);
  z-index: 200;
  transform: translateY(80px);
  opacity: 0;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
.content { animation: fadeIn .3s ease; }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-text">foodly<span>.</span></div>
      <div class="logo-sub">CRM v1.0</div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Principal</div>
      <div class="nav-item active" onclick="switchView('dashboard')">
        <span class="nav-icon">⚡</span> Dashboard
      </div>
      <div class="nav-item" onclick="switchView('pipeline')">
        <span class="nav-icon">🎯</span> Pipeline
        <span class="nav-badge" id="badge-pipeline">0</span>
      </div>
      <div class="nav-item" onclick="switchView('clientes')">
        <span class="nav-icon">🏢</span> Clientes activos
        <span class="nav-badge" id="badge-clientes">0</span>
      </div>
    </div>

    <div class="nav-section" style="margin-top:.5rem;">
      <div class="nav-label">Operación</div>
      <div class="nav-item" onclick="switchView('maquinas')">
        <span class="nav-icon">🤖</span> Máquinas
      </div>
      <div class="nav-item" onclick="switchView('tareas')">
        <span class="nav-icon">✅</span> Tareas
        <span class="nav-badge warn" id="badge-tareas">0</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">F</div>
        <div>
          <div class="user-name">foodly.</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="page-sub" id="page-sub">Vista general del negocio</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="exportData()">↓ Exportar</button>
        <button class="btn btn-primary" onclick="openModal('prospecto')">+ Nuevo prospecto</button>
      </div>
    </div>

    <div class="content" id="content">
      <!-- JS renderiza aquí -->
    </div>
  </div>
</div>

<!-- MODAL NUEVO PROSPECTO -->
<div class="modal-overlay" id="modal-prospecto">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo prospecto</div>
      <button class="modal-close" onclick="closeModal('prospecto')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Empresa *</label>
          <input class="form-input" id="f-empresa" placeholder="ej: Empresa ABC SpA">
        </div>
        <div class="form-group">
          <label class="form-label">Contacto *</label>
          <input class="form-input" id="f-contacto" placeholder="Nombre del contacto">
        </div>

<script>

// ═══════════════════════════════════════════════
// STATE

  contactado:  { label: 'Contactado',  color: '#5B9BD5', dot: '#5B9BD5' },

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function diasDesde(fecha) {
  const d = Math.floor((Date.now() - new Date(fecha)) / 86400000);
  return d;
}
function formatFecha(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 60) return `hace ${diff}m`;
  if (diff < 1440) return `hace ${Math.floor(diff/60)}h`;
  return `hace ${Math.floor(diff/1440)}d`;
}
function valorEstimado(p) {
  // ~15 ventas/día, neto $205k/mes proporcional a personas
  const base = p.personas >= 200 ? 205155 : 136000;
  return Math.round(base * (p.personas / 200));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function updateBadges() {
  const prospectos = DB.prospectos().filter(p => p.etapa !== 'ganado');
  const tareas = DB.tareas().filter(t => !t.completada);
  document.getElementById('badge-pipeline').textContent = prospectos.length;

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event?.target?.closest('.nav-item')?.classList.add('active');
  render();
}

function render() {
  const c = document.getElementById('content');
  const titles = {
    dashboard: ['Dashboard', 'Vista general del negocio'],
    pipeline: ['Pipeline de ventas', 'Prospectos y seguimiento'],
    clientes: ['Clientes activos', 'Máquinas instaladas'],
    maquinas: ['Máquinas', 'Inventario y estado'],
    tareas: ['Tareas pendientes', 'Acciones del equipo'],
  };
  const [title, sub] = titles[currentView] || ['', ''];
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub;

  // Update active nav
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.remove('active');
    const views = ['dashboard','pipeline','clientes','maquinas','tareas'];
    if (el.getAttribute('onclick')?.includes(views[i] || '')) el.classList.add('active');
  });

  if (currentView === 'dashboard') c.innerHTML = renderDashboard();
  else if (currentView === 'pipeline') c.innerHTML = renderPipeline();
  else if (currentView === 'clientes') c.innerHTML = renderClientes();
  else if (currentView === 'maquinas') c.innerHTML = renderMaquinas();
  else if (currentView === 'tareas') c.innerHTML = renderTareas();

  updateBadges();
}

// ─── DASHBOARD ───

// ─── TAREAS ───
function renderTareas() {
  const tareas = DB.tareas();
  const pendientes = tareas.filter(t => !t.completada);
  const completadas = tareas.filter(t => t.completada);
  const hoy = new Date().toISOString().split('T')[0];

  return `
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;">
    <button class="btn btn-primary" onclick="openModal('tarea')">+ Nueva tarea</button>
    <span style="font-size:.78rem;color:var(--text3);align-self:center;font-family:'Space Mono',monospace;">${pendientes.length} pendientes · ${completadas.length} completadas</span>
  </div>
  <div class="clients-table" style="margin-bottom:1rem;">
    <div class="table-header" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;">
      <div class="th">✓</div>
      <div class="th">Tarea</div>
      <div class="th">Empresa</div>
      <div class="th">Fecha</div>
      <div class="th">Asignado</div>
      <div class="th">Estado</div>
    </div>
    ${pendientes.map(t => `
    <div class="table-row" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;" onclick="toggleTarea(${t.id})">
      <div style="width:16px;height:16px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;cursor:pointer;"></div>
      <div class="td td-main">${t.titulo}<br><span style="font-size:.7rem;color:var(--text3);font-weight:400;">${t.tipo}</span></div>
      <div class="td" style="font-size:.78rem;">${t.empresa}</div>
      <div class="td td-mono" style="font-size:.7rem;">${t.fecha}</div>
      <div class="td"><span class="tag tag-gray">${t.asignado}</span></div>
      <div class="td"><span class="tag ${t.fecha<=hoy?'tag-red':'tag-blue'}">${t.fecha<=hoy?'⚡ Hoy':'Pendiente'}</span></div>
    </div>`).join('') || '<div class="empty"><div class="empty-icon">✅</div>Sin tareas pendientes — todo al día</div>'}
  </div>
  ${completadas.length ? `
  <div style="font-size:.75rem;color:var(--text3);margin-bottom:.5rem;font-family:'Space Mono',monospace;">COMPLETADAS (${completadas.length})</div>
  <div class="clients-table" style="opacity:.5;">
    ${completadas.slice(0,3).map(t => `
    <div class="table-row" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;cursor:default;">
      <div style="width:16px;height:16px;border:2px solid var(--green);border-radius:4px;background:var(--green);flex-shrink:0;"></div>
      <div class="td" style="text-decoration:line-through;color:var(--text3);">${t.titulo}</div>
      <div class="td" style="font-size:.78rem;color:var(--text3);">${t.empresa}</div>
      <div class="td td-mono" style="font-size:.7rem;color:var(--text3);">${t.fecha}</div>
      <div class="td"><span class="tag tag-gray">${t.asignado}</span></div>
      <div class="td"><span class="tag tag-green">✓</span></div>
    </div>`).join('')}
  </div>` : ''}`;
}

// ═══════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════
function openModal(type) {
  if (type === 'prospecto') {
    editingId = null;
    document.querySelector('#modal-prospecto .modal-title').textContent = 'Nuevo prospecto';
    ['f-empresa','f-contacto','f-cargo','f-telefono','f-email','f-personas','f-notas','f-direccion'].forEach(id => { document.getElementById(id).value = ''; });
  }
  document.getElementById('modal-' + type).classList.add('open');
}
function openModalEtapa(etapa) {
  editingId = null;
  document.getElementById('f-etapa').value = etapa;
  document.getElementById('modal-prospecto').classList.add('open');
}
function closeModal(type) {
  document.getElementById('modal-' + type).classList.remove('open');
}

let editingId = null;

function saveProspecto() {
  const empresa = document.getElementById('f-empresa').value.trim();
  const contacto = document.getElementById('f-contacto').value.trim();
  if (!empresa || !contacto) { showToast('⚠ Empresa y contacto son requeridos'); return; }

  const prospectos = DB.prospectos();
  const datos = {
    empresa, contacto,
    cargo: document.getElementById('f-cargo').value.trim(),
    telefono: document.getElementById('f-telefono').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    personas: parseInt(document.getElementById('f-personas').value) || 0,
    etapa: document.getElementById('f-etapa').value,
    prioridad: document.getElementById('f-prioridad').value,
    direccion: document.getElementById('f-direccion').value.trim(),
    notas: document.getElementById('f-notas').value.trim(),
    ultimaActividad: new Date().toISOString().split('T')[0],
  };

  if (editingId) {
    const idx = prospectos.findIndex(p => p.id === editingId);
    if (idx !== -1) { prospectos[idx] = { ...prospectos[idx], ...datos }; }
    DB.set('prospectos', prospectos);
    DB.addActividad(`<strong>${empresa}</strong> actualizado`, '#F4C843');
    showToast('✓ Prospecto actualizado');
  } else {
    prospectos.push({ id: Date.now(), creado: new Date().toISOString().split('T')[0], ...datos });
    DB.set('prospectos', prospectos);
    DB.addActividad(`Nuevo prospecto: <strong>${empresa}</strong>`, '#5B9BD5');
    showToast('✓ Prospecto guardado');
  }

  editingId = null;
  closeModal('prospecto');
  ['f-empresa','f-contacto','f-cargo','f-telefono','f-email','f-personas','f-notas','f-direccion'].forEach(id => document.getElementById(id).value = '');
  render();
}

function saveTarea() {
  const titulo = document.getElementById('t-titulo').value.trim();
  if (!titulo) { showToast('⚠ Escribe la tarea'); return; }
  const tareas = DB.tareas();
  tareas.push({
    id: Date.now(),
    titulo,
    empresa: document.getElementById('t-empresa').value.trim(),
    fecha: document.getElementById('t-fecha').value || new Date().toISOString().split('T')[0],
    tipo: document.getElementById('t-tipo').value,
    asignado: document.getElementById('t-asignado').value,
    notas: document.getElementById('t-notas').value.trim(),
    completada: false,
  });
  DB.set('tareas', tareas);
  closeModal('tarea');
  ['t-titulo','t-empresa','t-notas'].forEach(id => document.getElementById(id).value = '');
  showToast('✓ Tarea guardada');
  render();
}

function toggleTarea(id) {
  const tareas = DB.tareas();
  const t = tareas.find(t => t.id === id);
  if (t) { t.completada = !t.completada; DB.set('tareas', tareas); }
  if (t?.completada) { showToast('✓ Tarea completada'); DB.addActividad(`Tarea completada: <strong>${t.titulo}</strong>`, '#1FD79A'); }
  render();
}

function moverEtapa(id) {
  const orden = ['prospecto','contactado','reunion','propuesta','cierre','ganado'];
  const prospectos = DB.prospectos();
  const p = prospectos.find(p => p.id === id);
  if (!p) return;
  const idx = orden.indexOf(p.etapa);
  if (idx < orden.length - 1) {
    const nueva = orden[idx + 1];
    p.etapa = nueva;
    p.ultimaActividad = new Date().toISOString().split('T')[0];
    DB.set('prospectos', prospectos);
    DB.addActividad(`<strong>${p.empresa}</strong> avanzó a <strong>${ETAPAS[nueva]?.label || nueva}</strong>`, ETAPAS[nueva]?.color || '#1FD79A');
    showToast(`→ ${p.empresa} avanzó a ${ETAPAS[nueva]?.label || nueva}`);
    render();
  }
}

function eliminarProspecto(id) {
  const prospectos = DB.prospectos();
  const p = prospectos.find(p => p.id === id);
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.empresa}"?`)) return;
  DB.set('prospectos', prospectos.filter(p => p.id !== id));
  DB.addActividad(`Prospecto eliminado: <strong>${p.empresa}</strong>`, '#E24B4A');
  showToast('🗑 Prospecto eliminado');
  render();
}

function editProspecto(id) {
  const p = DB.prospectos().find(p => p.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('f-empresa').value = p.empresa;
  document.getElementById('f-contacto').value = p.contacto;
  document.getElementById('f-cargo').value = p.cargo || '';
  document.getElementById('f-telefono').value = p.telefono || '';
  document.getElementById('f-email').value = p.email || '';
  document.getElementById('f-personas').value = p.personas || '';
  document.getElementById('f-etapa').value = p.etapa;
  document.getElementById('f-prioridad').value = p.prioridad;
  document.getElementById('f-direccion').value = p.direccion || '';
  document.getElementById('f-notas').value = p.notas || '';
  document.querySelector('#modal-prospecto .modal-title').textContent = 'Editar prospecto';
  document.getElementById('modal-prospecto').classList.add('open');
}

function exportData() {
  const data = { prospectos: DB.prospectos(), tareas: DB.tareas(), exportado: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `foodly-crm-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('↓ Datos exportados');
}

// Cerrar modales con ESC o click overlay
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); });
document.querySelectorAll('.modal-overlay').forEach(el => el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); }));

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foodly. CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F0D;--bg2:#111710;--bg3:#161D14;--bg4:#1C2419;--green:#1FD79A;--green2:#0FAF7A;--green3:rgba(31,215,154,0.12);--green4:rgba(31,215,154,0.06);--text:#E8EDE6;--text2:#8A9688;--text3:#4A5448;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.04);--yellow:#F4C843;--red:#E24B4A;--blue:#5B9BD5;--orange:#E8874A;--purple:#9B7FD4;--r:10px;--rs:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:2px;}
.app{display:flex;height:100vh;}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 0;}
.logo{padding:0 1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.logo-text{font-size:1.4rem;font-weight:800;color:var(--text);letter-spacing:-0.03em;}
.logo-text span{color:var(--green);}
.logo-sub{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
.nav-section{padding:0 .75rem;margin-bottom:.25rem;}
.nav-label{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:.5rem .5rem .25rem;}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:var(--rs);cursor:pointer;color:var(--text2);font-size:.85rem;font-weight:500;transition:all .15s;position:relative;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--green3);color:var(--green);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:60%;background:var(--green);border-radius:2px;}
.nav-icon{font-size:1rem;width:18px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--green);color:var(--bg);font-family:'Space Mono',monospace;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;}
.nav-badge.warn{background:var(--yellow);}
.sidebar-footer{margin-top:auto;padding:1rem 1.25rem 0;border-top:1px solid var(--border);}
.user-card{display:flex;align-items:center;gap:.6rem;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--green3);border:1px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--green);flex-shrink:0;}
.user-name{font-size:.8rem;font-weight:600;color:var(--text);}
.user-role{font-size:.65rem;color:var(--text3);font-family:'Space Mono',monospace;}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;padding:1rem 1.75rem;border-bottom:1px solid var(--border);gap:1rem;background:var(--bg);position:sticky;top:0;z-index:10;}
.page-title{font-size:1rem;font-weight:700;color:var(--text);}
.page-sub{font-size:.75rem;color:var(--text3);font-family:'Space Mono',monospace;}
.topbar-actions{margin-left:auto;display:flex;gap:.5rem;}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:var(--rs);font-family:'Bricolage Grotesque',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--green);color:var(--bg);}
.btn-primary:hover{background:var(--green2);transform:translateY(-1px);}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg4);color:var(--text);}
.btn-danger{background:rgba(226,75,74,.1);color:var(--red);border:1px solid rgba(226,75,74,.2);}
.btn-danger:hover{background:rgba(226,75,74,.2);}
.content{padding:1.5rem 1.75rem;flex:1;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;position:relative;overflow:hidden;transition:border-color .2s;}
.stat-card:hover{border-color:rgba(31,215,154,0.2);}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent,var(--green));opacity:.4;}
.stat-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem;}
.stat-value{font-size:1.6rem;font-weight:800;color:var(--text);line-height:1;margin-bottom:.3rem;}
.stat-sub{font-size:.72rem;color:var(--text3);}

/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-bottom:1rem;}
.pipeline-col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.pipeline-header{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
.pipeline-stage-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pipeline-stage-name{font-size:.72rem;font-weight:700;color:var(--text2);flex:1;text-transform:uppercase;letter-spacing:.04em;}
.pipeline-count{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:10px;}
.pipeline-cards{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;min-height:100px;}
.prospect-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:.75rem;transition:all .15s;position:relative;}
.prospect-card:hover{border-color:var(--border);background:var(--bg4);}
.prospect-card.urgent{border-left:2px solid var(--yellow);}
.prospect-card.hot{border-left:2px solid var(--red);}
.prospect-name{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prospect-meta{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text3);margin-bottom:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prospect-footer{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem;}
.prospect-personas{font-size:.7rem;color:var(--text3);}
.prospect-value{font-family:'Space Mono',monospace;font-size:.68rem;font-weight:700;color:var(--green);}
.prospect-days{font-family:'Space Mono',monospace;font-size:.6rem;padding:1px 5px;border-radius:4px;background:var(--bg);color:var(--text3);}
.prospect-days.warn{color:var(--yellow);background:rgba(244,200,67,.1);}
.card-actions{display:flex;gap:.3rem;}
.card-btn{flex:1;padding:.28rem .4rem;border-radius:4px;font-size:.68rem;font-weight:600;cursor:pointer;border:none;font-family:'Bricolage Grotesque',sans-serif;transition:all .15s;}
.card-btn-advance{background:rgba(31,215,154,.08);border:1px solid rgba(31,215,154,.2);color:var(--green);}
.card-btn-advance:hover{background:rgba(31,215,154,.18);}
.card-btn-edit{background:rgba(91,155,213,.08);border:1px solid rgba(91,155,213,.2);color:var(--blue);}
.card-btn-edit:hover{background:rgba(91,155,213,.18);}
.card-btn-del{background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.2);color:var(--red);flex:none;padding:.28rem .5rem;}
.card-btn-del:hover{background:rgba(226,75,74,.18);}
.add-card{border:1px dashed var(--border);border-radius:var(--rs);padding:.6rem;text-align:center;cursor:pointer;color:var(--text3);font-size:.75rem;transition:all .15s;}
.add-card:hover{border-color:var(--green);color:var(--green);background:var(--green4);}

/* TABLE */
.data-table{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.table-head{display:grid;padding:.65rem 1.25rem;border-bottom:1px solid var(--border);gap:1rem;}
.th{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.table-row-item{display:grid;padding:.8rem 1.25rem;border-bottom:1px solid var(--border2);gap:1rem;align-items:center;transition:background .15s;}
.table-row-item:last-child{border-bottom:none;}
.table-row-item:hover{background:var(--bg3);}
.td{font-size:.82rem;color:var(--text2);}
.td-main{color:var(--text);font-weight:600;}
.td-mono{font-family:'Space Mono',monospace;font-size:.75rem;}
.row-actions{display:flex;gap:.4rem;justify-content:flex-end;}

/* STATUS */
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:600;}
.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.s-active{color:var(--green);background:rgba(31,215,154,.1);}
.s-warn{color:var(--yellow);background:rgba(244,200,67,.1);}
.s-blue{color:var(--blue);background:rgba(91,155,213,.1);}
.s-gray{color:var(--text3);background:var(--bg3);}

/* TAGS */
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:600;}
.tag-green{background:rgba(31,215,154,.1);color:var(--green);}
.tag-yellow{background:rgba(244,200,67,.1);color:var(--yellow);}
.tag-red{background:rgba(226,75,74,.1);color:var(--red);}
.tag-blue{background:rgba(91,155,213,.1);color:var(--blue);}
.tag-gray{background:var(--bg3);color:var(--text3);}

/* ACTIVITY */
.activity-feed{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.activity-header{padding:.85rem 1.25rem;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:700;color:var(--text);}
.activity-item{display:flex;gap:.75rem;padding:.7rem 1.25rem;border-bottom:1px solid var(--border2);align-items:flex-start;}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.activity-text{font-size:.82rem;color:var(--text2);line-height:1.4;flex:1;}
.activity-text strong{color:var(--text);}
.activity-time{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text3);white-space:nowrap;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:500px;max-height:85vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:1rem;font-weight:700;color:var(--text);}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .15s;}
.modal-close:hover{background:var(--bg4);color:var(--text);}
.modal-body{padding:1.25rem 1.5rem;}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
.modal-footer-right{display:flex;gap:.5rem;}
.form-group{margin-bottom:1rem;}
.form-label{display:block;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:.4rem;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:.55rem .75rem;color:var(--text);font-family:'Bricolage Grotesque',sans-serif;font-size:.85rem;outline:none;transition:border-color .15s;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,215,154,.08);}
.form-select option{background:var(--bg3);}
.form-textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{background:var(--bg2);border:1px solid rgba(226,75,74,.3);border-radius:14px;padding:1.5rem;width:360px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.confirm-icon{font-size:2rem;margin-bottom:.75rem;}
.confirm-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.confirm-msg{font-size:.82rem;color:var(--text2);margin-bottom:1.25rem;line-height:1.5;}
.confirm-actions{display:flex;gap:.5rem;justify-content:center;}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg2);border:1px solid var(--green);border-radius:var(--r);padding:.75rem 1.25rem;font-size:.82rem;color:var(--green);z-index:300;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-color:var(--red);color:var(--red);}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;}
.empty-icon{font-size:2rem;opacity:.2;margin-bottom:.75rem;}
.empty-text{font-size:.85rem;color:var(--text3);margin-bottom:1rem;}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 320px;gap:1rem;margin-top:1.5rem;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.section-title-text{font-size:.85rem;font-weight:700;color:var(--text);}
.section-sub{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--text3);margin-top:1px;}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.content{animation:fadeIn .25s ease;}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="logo">
    <div class="logo-text">foodly<span>.</span></div>
    <div class="logo-sub">CRM v2.0</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Principal</div>
    <div class="nav-item active" onclick="nav('dashboard',this)"><span class="nav-icon">⚡</span>Dashboard</div>
    <div class="nav-item" onclick="nav('pipeline',this)"><span class="nav-icon">🎯</span>Pipeline<span class="nav-badge" id="badge-pipeline">0</span></div>
    <div class="nav-item" onclick="nav('clientes',this)"><span class="nav-icon">🏢</span>Clientes activos<span class="nav-badge" id="badge-clientes">0</span></div>
  </div>
  <div class="nav-section" style="margin-top:.5rem;">
    <div class="nav-label">Operación</div>
    <div class="nav-item" onclick="nav('maquinas',this)"><span class="nav-icon">🤖</span>Máquinas</div>
    <div class="nav-item" onclick="nav('tareas',this)"><span class="nav-icon">✅</span>Tareas<span class="nav-badge warn" id="badge-tareas">0</span></div>
  </div>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">F</div>
      <div><div class="user-name">foodly.</div><div class="user-role">Admin</div></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="page-sub" id="page-sub">Vista general</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="exportData()">↓ Exportar</button>
      <button class="btn btn-primary" onclick="abrirProspecto()">+ Nuevo prospecto</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>

<!-- MODAL PROSPECTO -->
<div class="modal-overlay" id="modal-prospecto">
<div class="modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-prospecto-title">Nuevo prospecto</div>
    <button class="modal-close" onclick="cerrarModal('prospecto')">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-row">
      <div class="form-group"><label class="form-label">Empresa *</label><input class="form-input" id="p-empresa" placeholder="Empresa ABC SpA"></div>
      <div class="form-group"><label class="form-label">Contacto *</label><input class="form-input" id="p-contacto" placeholder="Nombre contacto"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Cargo</label><input class="form-input" id="p-cargo" placeholder="Gerente RRHH"></div>
      <div class="form-group"><label class="form-label">Teléfono</label><input class="form-input" id="p-tel" placeholder="+56 9 XXXX XXXX"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="p-email" type="email" placeholder="contacto@empresa.cl"></div>
      <div class="form-group"><label class="form-label">N° personas</label><input class="form-input" id="p-personas" type="number" placeholder="150"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Etapa</label>
        <select class="form-select" id="p-etapa">
          <option value="prospecto">Prospecto</option>
          <option value="contactado">Contactado</option>
          <option value="reunion">Reunión agendada</option>
          <option value="propuesta">Propuesta enviada</option>
          <option value="cierre">En cierre</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Prioridad</label>
        <select class="form-select" id="p-prioridad">
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Dirección / Comuna</label><input class="form-input" id="p-dir" placeholder="Las Condes, Santiago"></div>
    <div class="form-group"><label class="form-label">Notas</label><textarea class="form-textarea" id="p-notas" placeholder="Contexto, próximos pasos..."></textarea></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-danger" id="btn-eliminar-prospecto" style="display:none;" onclick="confirmarEliminar('prospecto')">🗑 Eliminar</button>
    <div class="modal-footer-right">
      <button class="btn btn-ghost" onclick="cerrarModal('prospecto')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarProspecto()">Guardar</button>
    </div>
  </div>
</div>
</div>

<!-- MODAL TAREA -->
<div class="modal-overlay" id="modal-tarea">
<div class="modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-tarea-title">Nueva tarea</div>
    <button class="modal-close" onclick="cerrarModal('tarea')">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-group"><label class="form-label">Tarea *</label><input class="form-input" id="t-titulo" placeholder="ej: Llamar a gerente de RRHH"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Empresa</label><input class="form-input" id="t-empresa" placeholder="Empresa ABC"></div>
      <div class="form-group"><label class="form-label">Fecha límite</label><input class="form-input" id="t-fecha" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo</label>
        <select class="form-select" id="t-tipo">
          <option value="llamada">📞 Llamada</option>
          <option value="reunion">🤝 Reunión</option>
          <option value="email">📧 Email</option>
          <option value="propuesta">📄 Enviar propuesta</option>
          <option value="seguimiento">🔄 Seguimiento</option>
          <option value="instalacion">🔧 Instalación</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Asignado a</label>
        <select class="form-select" id="t-asignado">
          <option value="yo">Yo</option>
          <option value="gianluca">Gianluca</option>
          <option value="ambos">Ambos</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Notas</label><textarea class="form-textarea" id="t-notas" placeholder="Detalle..."></textarea></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-danger" id="btn-eliminar-tarea" style="display:none;" onclick="confirmarEliminar('tarea')">🗑 Eliminar</button>
    <div class="modal-footer-right">
      <button class="btn btn-ghost" onclick="cerrarModal('tarea')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarTarea()">Guardar</button>
    </div>
  </div>
</div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirm-overlay">
<div class="confirm-box">
  <div class="confirm-icon">⚠️</div>
  <div class="confirm-title" id="confirm-title">¿Eliminar?</div>
  <div class="confirm-msg" id="confirm-msg">Esta acción no se puede deshacer.</div>
  <div class="confirm-actions">
    <button class="btn btn-ghost" onclick="cerrarConfirm()">Cancelar</button>
    <button class="btn btn-danger" onclick="ejecutarEliminar()">Sí, eliminar</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// DB
// ══════════════════════════════════════════
const DB = {
  get:(k)=>JSON.parse(localStorage.getItem('fcrm_'+k)||'[]'),
  set:(k,v)=>localStorage.setItem('fcrm_'+k,JSON.stringify(v)),
  log:(txt,color='#1FD79A')=>{const a=DB.get('log');a.unshift({txt,color,ts:new Date().toISOString()});DB.set('log',a.slice(0,60));}
};

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let view='dashboard';
let editId=null;
let editType=null;
let confirmCallback=null;

const ETAPAS={
  prospecto:{label:'Prospecto',color:'#4A5448'},
  contactado:{label:'Contactado',color:'#5B9BD5'},
  reunion:{label:'Reunión',color:'#9B7FD4'},
  propuesta:{label:'Propuesta',color:'#F4C843'},
  cierre:{label:'En cierre',color:'#1FD79A'},
  ganado:{label:'Ganado ✓',color:'#1FD79A'},
};
const ORDEN_ETAPAS=['prospecto','contactado','reunion','propuesta','cierre','ganado'];

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function dias(f){return Math.floor((Date.now()-new Date(f))/86400000);}
function fmtTs(ts){const d=Math.floor((Date.now()-new Date(ts))/60000);if(d<60)return`hace ${d}m`;if(d<1440)return`hace ${Math.floor(d/60)}h`;return`hace ${Math.floor(d/1440)}d`;}
function valorEst(p){const b=p.personas>=200?205155:p.personas>=150?154000:136000;return Math.round(b*(p.personas||100)/200);}
function hoy(){return new Date().toISOString().split('T')[0];}
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'')+' show';setTimeout(()=>t.classList.remove('show'),3000);}

function updateBadges(){
  const p=DB.get('prospectos');
  document.getElementById('badge-pipeline').textContent=p.filter(x=>x.etapa!=='ganado').length;
  document.getElementById('badge-clientes').textContent=p.filter(x=>x.etapa==='ganado').length;
  document.getElementById('badge-tareas').textContent=DB.get('tareas').filter(x=>!x.done).length;
}

// ══════════════════════════════════════════
// NAV
// ══════════════════════════════════════════
function nav(v,el){
  view=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  render();
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render(){
  const titles={dashboard:['Dashboard','Vista general del negocio'],pipeline:['Pipeline de ventas','Prospectos y seguimiento'],clientes:['Clientes activos','Máquinas instaladas'],maquinas:['Máquinas','Inventario y estado'],tareas:['Tareas pendientes','Acciones del equipo']};
  const[tt,ts]=titles[view]||['',''];
  document.getElementById('page-title').textContent=tt;
  document.getElementById('page-sub').textContent=ts;
  const c=document.getElementById('content');
  if(view==='dashboard')c.innerHTML=renderDash();
  else if(view==='pipeline')c.innerHTML=renderPipeline();
  else if(view==='clientes')c.innerHTML=renderClientes();
  else if(view==='maquinas')c.innerHTML=renderMaquinas();
  else if(view==='tareas')c.innerHTML=renderTareas();
  updateBadges();
}

// ── DASHBOARD ──
function renderDash(){
  const p=DB.get('prospectos');
  const t=DB.get('tareas').filter(x=>!x.done);
  const log=DB.get('log');
  return`
  <div class="stats-row">
    <div class="stat-card" style="--accent:#1FD79A;"><div class="stat-label">Prospectos activos</div><div class="stat-value">${p.filter(x=>x.etapa!=='ganado').length}</div><div class="stat-sub">en pipeline</div></div>
    <div class="stat-card" style="--accent:#F4C843;"><div class="stat-label">En cierre</div><div class="stat-value">${p.filter(x=>x.etapa==='cierre').length}</div><div class="stat-sub">listos para cerrar</div></div>
    <div class="stat-card" style="--accent:#5B9BD5;"><div class="stat-label">Valor potencial/mes</div><div class="stat-value" style="font-size:1rem;">$${(p.reduce((s,x)=>s+valorEst(x),0)/1000000).toFixed(1)}M</div><div class="stat-sub">si cierras todo</div></div>
    <div class="stat-card" style="--accent:#E24B4A;"><div class="stat-label">Tareas pendientes</div><div class="stat-value">${t.length}</div><div class="stat-sub">${t.filter(x=>x.fecha<=hoy()).length} vencen hoy</div></div>
  </div>
  <div class="section-header"><div><div class="section-title-text">Prospectos recientes</div></div><button class="btn btn-ghost" onclick="nav('pipeline')" style="font-size:.75rem;">Ver pipeline →</button></div>
  <div class="data-table" style="margin-bottom:1.5rem;">
    <div class="table-head" style="grid-template-columns:2fr 1fr 1fr 1fr 80px;"><div class="th">Empresa</div><div class="th">Personas</div><div class="th">Etapa</div><div class="th">Valor est./mes</div><div class="th"></div></div>
    ${p.filter(x=>x.etapa!=='ganado').slice(0,6).map(x=>`
    <div class="table-row-item" style="grid-template-columns:2fr 1fr 1fr 1fr 80px;">
      <div class="td td-main">${x.empresa}<br><span style="font-size:.7rem;color:var(--text3);font-weight:400;">${x.contacto}</span></div>
      <div class="td td-mono">${x.personas||'?'}</div>
      <div class="td"><span class="status-pill" style="color:${ETAPAS[x.etapa]?.color};background:${ETAPAS[x.etapa]?.color}18;">${ETAPAS[x.etapa]?.label||x.etapa}</span></div>
      <div class="td td-mono" style="color:var(--green);">$${(valorEst(x)/1000).toFixed(0)}k</div>
      <div class="td"><div class="row-actions"><button class="btn btn-ghost" style="font-size:.7rem;padding:.3rem .6rem;" onclick="abrirProspecto(${x.id})">Editar</button></div></div>
    </div>`).join('')||'<div class="empty"><div class="empty-icon">🎯</div><div class="empty-text">Sin prospectos aún</div><button class="btn btn-primary" onclick="abrirProspecto()">+ Agregar primero</button></div>'}
  </div>
  <div class="bottom-grid">
    <div>
      <div class="section-header"><div class="section-title-text">Tareas urgentes</div><button class="btn btn-ghost" onclick="abrirTarea()" style="font-size:.75rem;">+ Tarea</button></div>
      <div class="data-table">
        ${t.slice(0,5).map(x=>`
        <div class="table-row-item" style="grid-template-columns:auto 1fr 80px 60px;gap:.75rem;">
          <div style="width:16px;height:16px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;" onclick="toggleTarea(${x.id})"></div>
          <div class="td td-main" style="cursor:pointer;" onclick="abrirTarea(${x.id})">${x.titulo}<br><span style="font-size:.7rem;color:var(--text3);font-weight:400;">${x.empresa||'—'}</span></div>
          <div class="td td-mono" style="font-size:.7rem;">${x.fecha||'—'}</div>
          <div class="td"><span class="tag ${x.fecha&&x.fecha<=hoy()?'tag-red':'tag-blue'}">${x.fecha&&x.fecha<=hoy()?'Hoy':'Pend.'}</span></div>
        </div>`).join('')||'<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Sin tareas pendientes</div></div>'}
      </div>
    </div>
    <div>
      <div class="section-header"><div class="section-title-text">Actividad</div></div>
      <div class="activity-feed">
        ${log.slice(0,8).map(a=>`<div class="activity-item"><div class="activity-dot" style="background:${a.color};"></div><div class="activity-text">${a.txt}</div><div class="activity-time">${fmtTs(a.ts)}</div></div>`).join('')||'<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Sin actividad aún</div></div>'}
      </div>
    </div>
  </div>`;
}

// ── PIPELINE ──
function renderPipeline(){
  const p=DB.get('prospectos');
  const etapas=['prospecto','contactado','reunion','propuesta','cierre'];
  return`
  <div class="pipeline">
    ${etapas.map(e=>{
      const cards=p.filter(x=>x.etapa===e);
      return`<div class="pipeline-col">
        <div class="pipeline-header"><div class="pipeline-stage-dot" style="background:${ETAPAS[e].color};"></div><div class="pipeline-stage-name">${ETAPAS[e].label}</div><div class="pipeline-count">${cards.length}</div></div>
        <div class="pipeline-cards">
          ${cards.map(x=>`
          <div class="prospect-card ${x.prioridad==='urgente'?'hot':x.prioridad==='alta'?'urgent':''}">
            <div class="prospect-name">${x.empresa}</div>
            <div class="prospect-meta">${x.contacto}${x.cargo?` · ${x.cargo}`:''}</div>
            <div class="prospect-footer">
              <div class="prospect-personas">👥 ${x.personas||'?'}</div>
              <div class="prospect-value">$${(valorEst(x)/1000).toFixed(0)}k/m</div>
              <div class="prospect-days ${dias(x.ua||x.creado)>7?'warn':''}">${dias(x.ua||x.creado)}d</div>
            </div>
            <div class="card-actions">
              <button class="card-btn card-btn-advance" onclick="avanzarEtapa(${x.id})">${e==='cierre'?'✓ Ganado':'Avanzar →'}</button>
              <button class="card-btn card-btn-edit" onclick="abrirProspecto(${x.id})">✎</button>
              <button class="card-btn card-btn-del" onclick="confirmarEliminar('prospecto',${x.id},'${x.empresa}')">🗑</button>
            </div>
          </div>`).join('')}
          <div class="add-card" onclick="abrirProspectoEtapa('${e}')">+ Agregar</div>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div style="font-size:.75rem;color:var(--text3);font-family:'Space Mono',monospace;">Valor total pipeline: <span style="color:var(--green);font-weight:700;">$${(p.reduce((s,x)=>s+valorEst(x),0)/1000000).toFixed(1)}M CLP/mes</span> estimado si cierras todo</div>`;
}

// ── CLIENTES ──
function renderClientes(){
  const g=DB.get('prospectos').filter(x=>x.etapa==='ganado');
  if(!g.length)return`<div class="empty"><div class="empty-icon">🏢</div><div class="empty-text">Sin clientes activos.<br>Cuando cierres un prospecto aparece aquí.</div><button class="btn btn-primary" onclick="nav('pipeline')">Ver pipeline →</button></div>`;
  return`<div class="data-table">
    <div class="table-head" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 80px;"><div class="th">Empresa</div><div class="th">Personas</div><div class="th">Máquinas</div><div class="th">Neto est./mes</div><div class="th">Estado</div><div class="th"></div></div>
    ${g.map(x=>`<div class="table-row-item" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 80px;">
      <div class="td td-main">${x.empresa}<br><span style="font-size:.7rem;color:var(--text3);font-weight:400;">${x.contacto} · ${x.tel||'—'}</span></div>
      <div class="td td-mono">${x.personas}</div><div class="td td-mono">1</div>
      <div class="td td-mono" style="color:var(--green);">$${(valorEst(x)/1000).toFixed(0)}k</div>
      <div class="td"><span class="status-pill s-active">Activo</span></div>
      <div class="td"><div class="row-actions"><button class="btn btn-ghost" style="font-size:.7rem;padding:.3rem .5rem;" onclick="abrirProspecto(${x.id})">Ver</button></div></div>
    </div>`).join('')}
  </div>`;
}

// ── MAQUINAS ──

  return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;">
      <div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><div><div style="font-size:.9rem;font-weight:700;">Máquina #001</div><div style="font-family:'Space Mono',monospace;font-size:.65rem;color:var(--text3);">Mini Store · 5 bandejas · 78x64cm</div></div><span class="status-pill s-warn">En instalación</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem;">
        <div style="background:var(--bg3);border-radius:6px;padding:.6rem .75rem;"><div style="font-size:.6rem;color:var(--text3);text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:2px;">Arriendo</div><div style="font-size:.8rem;font-weight:600;">6,5 UF/mes</div></div>
        <div style="background:var(--bg3);border-radius:6px;padding:.6rem .75rem;"><div style="font-size:.6rem;color:var(--text3);text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:2px;">Equilibrio</div><div style="font-size:.8rem;font-weight:600;">12 ventas/día</div></div>
        <div style="background:var(--bg3);border-radius:6px;padding:.6rem .75rem;"><div style="font-size:.6rem;color:var(--text3);text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:2px;">Meta neto</div><div style="font-size:.8rem;font-weight:600;color:var(--green);">$205k/mes</div></div>
        <div style="background:var(--bg3);border-radius:6px;padding:.6rem .75rem;"><div style="font-size:.6rem;color:var(--text3);text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:2px;">Compra mes 9</div><div style="font-size:.8rem;font-weight:600;">$1.236.043</div></div>
      </div>

    </div>
    <div style="background:var(--bg2);border:1px dashed var(--border);border-radius:var(--r);padding:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;cursor:pointer;" onmouseover="this.style.borderColor='var(--green)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:2rem;opacity:.2;">🤖</div>
      <div style="font-size:.85rem;font-weight:600;color:var(--text2);">+ Agregar máquina #002</div>
      <div style="font-size:.75rem;color:var(--text3);">Segunda máquina del plan</div>
    </div>

// ── TAREAS ──
function renderTareas(){
  const t=DB.get('tareas');
  const pend=t.filter(x=>!x.done);
  const done=t.filter(x=>x.done);
  return`
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;align-items:center;">
    <button class="btn btn-primary" onclick="abrirTarea()">+ Nueva tarea</button>
    <span style="font-size:.75rem;color:var(--text3);font-family:'Space Mono',monospace;">${pend.length} pendientes · ${done.length} completadas</span>
  </div>
  <div class="data-table" style="margin-bottom:1rem;">
    <div class="table-head" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;"><div class="th">✓</div><div class="th">Tarea</div><div class="th">Empresa</div><div class="th">Fecha</div><div class="th">Asignado</div><div class="th"></div></div>
    ${pend.map(x=>`
    <div class="table-row-item" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;">
      <div style="width:16px;height:16px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;" onclick="toggleTarea(${x.id})"></div>
      <div class="td td-main" style="cursor:pointer;" onclick="abrirTarea(${x.id})">${x.titulo}<br><span style="font-size:.7rem;color:var(--text3);font-weight:400;">${x.tipo||''}</span></div>
      <div class="td" style="font-size:.78rem;">${x.empresa||'—'}</div>
      <div class="td td-mono" style="font-size:.7rem;">${x.fecha||'—'}</div>
      <div class="td"><span class="tag tag-gray">${x.asignado||'yo'}</span></div>
      <div class="td"><div class="row-actions">
        <button class="btn btn-ghost" style="font-size:.7rem;padding:.25rem .5rem;" onclick="abrirTarea(${x.id})">✎</button>
        <button class="btn btn-danger" style="font-size:.7rem;padding:.25rem .5rem;" onclick="confirmarEliminar('tarea',${x.id},'${x.titulo.replace(/'/g,"\\'")}')">🗑</button>
      </div></div>
    </div>`).join('')||'<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Sin tareas pendientes</div></div>'}
  </div>
  ${done.length?`<div style="font-size:.75rem;color:var(--text3);margin-bottom:.5rem;font-family:'Space Mono',monospace;">COMPLETADAS (${done.length})</div>
  <div class="data-table" style="opacity:.5;">
    ${done.slice(0,5).map(x=>`<div class="table-row-item" style="grid-template-columns:auto 1fr 120px 80px 80px 80px;cursor:default;">
      <div style="width:16px;height:16px;border:2px solid var(--green);border-radius:4px;background:var(--green);flex-shrink:0;cursor:pointer;" onclick="toggleTarea(${x.id})"></div>
      <div class="td" style="text-decoration:line-through;color:var(--text3);">${x.titulo}</div>
      <div class="td" style="font-size:.78rem;color:var(--text3);">${x.empresa||'—'}</div>
      <div class="td td-mono" style="font-size:.7rem;color:var(--text3);">${x.fecha||'—'}</div>
      <div class="td"><span class="tag tag-gray">${x.asignado||'yo'}</span></div>
      <div class="td"><div class="row-actions"><button class="btn btn-danger" style="font-size:.7rem;padding:.25rem .5rem;" onclick="confirmarEliminar('tarea',${x.id},'${x.titulo.replace(/'/g,"\\'")}')">🗑</button></div></div>
    </div>`).join('')}
  </div>`:''}`;
}

// ══════════════════════════════════════════
// PROSPECTO CRUD
// ══════════════════════════════════════════
function abrirProspecto(id){
  editId=id||null; editType='prospecto';
  document.getElementById('modal-prospecto-title').textContent=id?'Editar prospecto':'Nuevo prospecto';
  document.getElementById('btn-eliminar-prospecto').style.display=id?'':'none';
  const p=id?DB.get('prospectos').find(x=>x.id===id):{};
  document.getElementById('p-empresa').value=p.empresa||'';
  document.getElementById('p-contacto').value=p.contacto||'';
  document.getElementById('p-cargo').value=p.cargo||'';
  document.getElementById('p-tel').value=p.tel||'';
  document.getElementById('p-email').value=p.email||'';
  document.getElementById('p-personas').value=p.personas||'';
  document.getElementById('p-etapa').value=p.etapa||'prospecto';
  document.getElementById('p-prioridad').value=p.prioridad||'normal';
  document.getElementById('p-dir').value=p.dir||'';
  document.getElementById('p-notas').value=p.notas||'';
  document.getElementById('modal-prospecto').classList.add('open');
}
function abrirProspectoEtapa(e){abrirProspecto();setTimeout(()=>document.getElementById('p-etapa').value=e,10);}
function cerrarModal(t){document.getElementById('modal-'+t).classList.remove('open');}

function guardarProspecto(){
  const empresa=document.getElementById('p-empresa').value.trim();
  const contacto=document.getElementById('p-contacto').value.trim();
  if(!empresa||!contacto){toast('⚠ Empresa y contacto son requeridos',true);return;}
  const datos={empresa,contacto,cargo:document.getElementById('p-cargo').value.trim(),tel:document.getElementById('p-tel').value.trim(),email:document.getElementById('p-email').value.trim(),personas:parseInt(document.getElementById('p-personas').value)||0,etapa:document.getElementById('p-etapa').value,prioridad:document.getElementById('p-prioridad').value,dir:document.getElementById('p-dir').value.trim(),notas:document.getElementById('p-notas').value.trim(),ua:hoy()};
  const list=DB.get('prospectos');
  if(editId){
    const i=list.findIndex(x=>x.id===editId);
    if(i!==-1)list[i]={...list[i],...datos};
    DB.log(`<strong>${empresa}</strong> actualizado`,'#F4C843');
    toast('✓ Prospecto actualizado');
  }else{
    list.push({id:Date.now(),creado:hoy(),...datos});
    DB.log(`Nuevo prospecto: <strong>${empresa}</strong>`,'#5B9BD5');
    toast('✓ Prospecto guardado');
  }
  DB.set('prospectos',list);
  cerrarModal('prospecto');
  render();
}

function avanzarEtapa(id){
  const list=DB.get('prospectos');
  const p=list.find(x=>x.id===id);
  if(!p)return;
  const i=ORDEN_ETAPAS.indexOf(p.etapa);
  if(i<ORDEN_ETAPAS.length-1){
    const nueva=ORDEN_ETAPAS[i+1];
    p.etapa=nueva; p.ua=hoy();
    DB.set('prospectos',list);
    DB.log(`<strong>${p.empresa}</strong> → ${ETAPAS[nueva]?.label||nueva}`,ETAPAS[nueva]?.color||'#1FD79A');
    toast(`→ ${p.empresa} avanzó a ${ETAPAS[nueva]?.label||nueva}`);
    render();
  }
}

// ══════════════════════════════════════════
// TAREA CRUD
// ══════════════════════════════════════════
function abrirTarea(id){
  editId=id||null; editType='tarea';
  document.getElementById('modal-tarea-title').textContent=id?'Editar tarea':'Nueva tarea';
  document.getElementById('btn-eliminar-tarea').style.display=id?'':'none';
  const t=id?DB.get('tareas').find(x=>x.id===id):{};
  document.getElementById('t-titulo').value=t.titulo||'';
  document.getElementById('t-empresa').value=t.empresa||'';
  document.getElementById('t-fecha').value=t.fecha||'';
  document.getElementById('t-tipo').value=t.tipo||'llamada';
  document.getElementById('t-asignado').value=t.asignado||'yo';
  document.getElementById('t-notas').value=t.notas||'';
  document.getElementById('modal-tarea').classList.add('open');
}

function guardarTarea(){
  const titulo=document.getElementById('t-titulo').value.trim();
  if(!titulo){toast('⚠ Escribe la tarea',true);return;}
  const datos={titulo,empresa:document.getElementById('t-empresa').value.trim(),fecha:document.getElementById('t-fecha').value,tipo:document.getElementById('t-tipo').value,asignado:document.getElementById('t-asignado').value,notas:document.getElementById('t-notas').value.trim()};
  const list=DB.get('tareas');
  if(editId){
    const i=list.findIndex(x=>x.id===editId);
    if(i!==-1)list[i]={...list[i],...datos};
    toast('✓ Tarea actualizada');
  }else{
    list.push({id:Date.now(),done:false,...datos});
    DB.log(`Nueva tarea: <strong>${titulo}</strong>`,'#9B7FD4');
    toast('✓ Tarea guardada');
  }
  DB.set('tareas',list);
  cerrarModal('tarea');
  render();
}

function toggleTarea(id){
  const list=DB.get('tareas');
  const t=list.find(x=>x.id===id);
  if(t){t.done=!t.done;DB.set('tareas',list);if(t.done){DB.log(`Tarea completada: <strong>${t.titulo}</strong>`,'#1FD79A');toast('✓ Completada');}else{toast('↩ Reabierta');} render();}
}

// ══════════════════════════════════════════
// ELIMINAR
// ══════════════════════════════════════════
function confirmarEliminar(tipo,id,nombre){
  editId=id; editType=tipo;
  // Si viene desde el modal
  if(!id){
    const list=tipo==='prospecto'?DB.get('prospectos'):DB.get('tareas');
    const item=list.find(x=>x.id===editId);
    nombre=item?.empresa||item?.titulo||'';
  }
  document.getElementById('confirm-title').textContent=`¿Eliminar ${tipo==='prospecto'?'prospecto':'tarea'}?`;
  document.getElementById('confirm-msg').textContent=`"${nombre}" será eliminado permanentemente.`;
  document.getElementById('confirm-overlay').classList.add('open');
}
function cerrarConfirm(){document.getElementById('confirm-overlay').classList.remove('open');}
function ejecutarEliminar(){
  const key=editType==='prospecto'?'prospectos':'tareas';
  const list=DB.get(key).filter(x=>x.id!==editId);
  DB.set(key,list);
  DB.log(`Eliminado: <strong>${editType}</strong>`,'#E24B4A');
  toast('🗑 Eliminado');
  cerrarConfirm();
  cerrarModal(editType);
  render();
}

// ══════════════════════════════════════════
// EXPORT
// ══════════════════════════════════════════
function exportData(){
  const data={prospectos:DB.get('prospectos'),tareas:DB.get('tareas'),exportado:new Date().toISOString()};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`foodly-crm-${hoy()}.json`;
  a.click();
  toast('↓ Datos exportados');
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-overlay.open,.confirm-overlay.open').forEach(m=>m.classList.remove('open'));}});
document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));
document.getElementById('confirm-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)cerrarConfirm();});
render();
</script>
</body>
</html>
